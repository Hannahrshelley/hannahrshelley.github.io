<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Reading Tracker</title>
<style>
  body { font-family: sans-serif; font-size: 17px; max-width: 600px; margin: 20px auto; padding: 0 16px; }
  #progress { color: #666; margin-bottom: 20px; font-size: 1.1em; }
  #reading-title { font-size: 1.4em; margin-bottom: 10px; }
  #reading-text { line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px; }
  button { padding: 12px 18px; font-size: 1em; cursor: pointer; margin: 4px 8px 4px 0; min-height: 44px; }
  #all-readings { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 20px; }
  #all-readings h2 { margin-top: 24px; }
  .month-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .month-row h3 { cursor: pointer; user-select: none; margin: 10px 0 4px; }
  .month-row button { font-size: 0.85em; padding: 6px 12px; min-height: 36px; }
  #all-readings label { display: block; padding: 8px 0; }
</style>
</head>
<body>

<div id="progress">Loading...</div>
<div id="reading-title"></div>
<div id="reading-text">Loading text...</div>
<button id="tick-btn">Mark as read</button>
<button id="read-ahead-btn" style="display:none;">Read ahead anyway</button>
<button id="toggle-view-btn">View all readings</button>
<div id="done-message" style="display:none;"></div>

<div id="all-readings" style="display:none;"></div>

<script>
// ---------- Config ----------
const BIN_ID = '6a8fcab6f5f4af5e294809b2';
const API_KEY = '$2a$10$sqGV7mGi/bHIr5dZC.X7XOki0RQkM5YGheiJoMmZneUTDotJzAfUu';
const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let schedule = [];   // static, from readings.json
let progress = {};   // dynamic, from JSONBin

// ---------- Data loading & saving ----------

async function loadData() {
  const scheduleRes = await fetch('readings.json');
  schedule = await scheduleRes.json();

  const progressRes = await fetch(BASE_URL + '/latest', {
    headers: { 'X-Access-Key': API_KEY }
  });
  const data = await progressRes.json();
  progress = data.record || {};
}

async function saveProgress() {
  await fetch(BASE_URL, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Access-Key': API_KEY
    },
    body: JSON.stringify(progress)
  });
}

function isDone(seq) {
  return progress[seq]?.done || false;
}

function markDone(seq, done) {
  progress[seq] = {
    done,
    completed_date: done ? new Date().toISOString().split('T')[0] : null
  };
}

function findFirstUnread() {
  return schedule.find(r => !isDone(r.seq));
}

// ---------- Fetching Bible text ----------

async function fetchReadingText(book, reference) {
  const bookParam = book.toLowerCase().replace(/\s+/g, '+');
  const url = `https://bible-api.com/${bookParam}+${reference}`;
  try {
    const res = await fetch(url);
    if (!res.ok) {
      return `Error: API returned ${res.status} for "${book} ${reference}"`;
    }
    const data = await res.json();
    return data.text || '(No text returned)';
  } catch (err) {
    return `Error fetching reading: ${err.message}`;
  }
}

// ---------- Main "up next" view ----------

async function renderCurrentReading(forceShow = false) {
  const current = findFirstUnread();
  const progressEl = document.getElementById('progress');
  const tickBtn = document.getElementById('tick-btn');
  const readAheadBtn = document.getElementById('read-ahead-btn');
  const doneMsg = document.getElementById('done-message');

  // Fully finished the whole plan
  if (!current) {
    progressEl.textContent = '';
    document.getElementById('reading-title').textContent = '';
    document.getElementById('reading-text').textContent = '';
    tickBtn.style.display = 'none';
    readAheadBtn.style.display = 'none';
    doneMsg.textContent = "🎉 You've finished the entire plan!";
    doneMsg.style.display = 'block';
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const plannedDate = new Date(current.planned_date + 'T00:00:00');
  const formatted = plannedDate.toLocaleDateString(undefined, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  const isAheadOfSchedule = plannedDate > today && !forceShow;

  if (isAheadOfSchedule) {
    progressEl.textContent = '';
    document.getElementById('reading-title').textContent = '';
    document.getElementById('reading-text').textContent = '';
    tickBtn.style.display = 'none';
    readAheadBtn.style.display = 'inline-block';
    doneMsg.textContent = `✅ All caught up! Next reading unlocks ${formatted}.`;
    doneMsg.style.display = 'block';
    return;
  }

  progressEl.textContent = `Scheduled for: ${formatted}`;
  doneMsg.style.display = 'none';
  tickBtn.style.display = 'inline-block';
  readAheadBtn.style.display = 'none';
  document.getElementById('reading-title').textContent = `${current.book} ${current.reference}`;
  document.getElementById('reading-text').textContent = 'Loading text...';

  const text = await fetchReadingText(current.book, current.reference);
  document.getElementById('reading-text').textContent = text;
}

document.getElementById('tick-btn').addEventListener('click', async () => {
  const current = findFirstUnread();
  if (!current) return;

  markDone(current.seq, true);
  await saveProgress();
  await renderCurrentReading();

  if (document.getElementById('all-readings').style.display !== 'none') {
    renderAllReadings();
  }
});

document.getElementById('read-ahead-btn').addEventListener('click', () => {
  renderCurrentReading(true);
});

// ---------- All readings view (grouped by year/month) ----------

function groupByYearMonth(list) {
  const groups = {};
  list.forEach(r => {
    const d = new Date(r.planned_date + 'T00:00:00');
    const year = d.getFullYear().toString();
    const month = d.toLocaleDateString(undefined, { month: 'long' });
    if (!groups[year]) groups[year] = {};
    if (!groups[year][month]) groups[year][month] = [];
    groups[year][month].push(r);
  });
  return groups;
}

function renderAllReadings() {
  const container = document.getElementById('all-readings');
  container.innerHTML = '';
  const grouped = groupByYearMonth(schedule);

  const today = new Date();
  const currentYear = today.getFullYear().toString();
  const currentMonth = today.toLocaleDateString(undefined, { month: 'long' });

  Object.keys(grouped).sort().forEach(year => {
    const yearHeader = document.createElement('h2');
    yearHeader.textContent = year;
    container.appendChild(yearHeader);

    Object.keys(grouped[year]).forEach(month => {
      const isCurrent = (year === currentYear && month === currentMonth);
      const monthReadings = grouped[year][month];

      const monthRow = document.createElement('div');
      monthRow.className = 'month-row';

      const monthHeader = document.createElement('h3');
      monthHeader.textContent = month;
      if (isCurrent) monthHeader.style.fontWeight = 'bold';

      const markAllBtn = document.createElement('button');
      markAllBtn.textContent = 'Mark all read';

      monthRow.appendChild(monthHeader);
      monthRow.appendChild(markAllBtn);
      container.appendChild(monthRow);

      const list = document.createElement('div');
      list.style.display = isCurrent ? 'block' : 'none';

      monthReadings.forEach(reading => {
        const row = document.createElement('label');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = isDone(reading.seq);
        checkbox.addEventListener('change', async () => {
          markDone(reading.seq, checkbox.checked);
          await saveProgress();
          await renderCurrentReading();
        });

        row.appendChild(checkbox);
        row.append(` ${reading.book} ${reading.reference}`);
        list.appendChild(row);
      });

      markAllBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const confirmed = confirm(`Mark all readings in ${month} ${year} as read?`);
        if (!confirmed) return;

        monthReadings.forEach(reading => markDone(reading.seq, true));
        await saveProgress();
        renderAllReadings();
        renderCurrentReading();
      });

      monthHeader.addEventListener('click', () => {
        list.style.display = (list.style.display === 'none') ? 'block' : 'none';
      });

      container.appendChild(list);
    });
  });
}

document.getElementById('toggle-view-btn').addEventListener('click', () => {
  const container = document.getElementById('all-readings');
  const isHidden = container.style.display === 'none';
  container.style.display = isHidden ? 'block' : 'none';
  if (isHidden) renderAllReadings();
});

// ---------- Init ----------

(async () => {
  try {
    await loadData();
    await renderCurrentReading();
  } catch (err) {
    document.getElementById('progress').textContent = '';
    document.getElementById('reading-title').textContent = 'Something went wrong';
    document.getElementById('reading-text').textContent = `Error: ${err.message}`;
  }
})();
</script>

</body>
</html>
